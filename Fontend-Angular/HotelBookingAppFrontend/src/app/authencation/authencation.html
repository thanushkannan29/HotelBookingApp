<div class="auth-container">

  <div class="container">

    <div class="row justify-content-center">

      <div class="col-lg-6 col-md-8">

        <div class="auth-card">

          <h2 class="text-center mb-4">Hotel Booking Portal</h2>

          <!-- LOGIN -->
          <div class="form-section">

            <h4 class="section-title">Login</h4>

            <div class="form-group">
              <label>Email</label>
              <input
                type="email"
                class="form-control"
                [(ngModel)]="loginModel.email"
                name="loginEmail"
                placeholder="Enter your email">
            </div>

            <div class="form-group">
              <label>Password</label>
              <input
                type="password"
                class="form-control"
                [(ngModel)]="loginModel.password"
                name="loginPassword"
                placeholder="Enter your password">
            </div>

            <button
              class="btn btn-primary w-100"
              (click)="login()">
              Login
            </button>

          </div>

          <hr>

          <!-- REGISTER OPTIONS -->

          <div class="text-center">

            <p>New to our platform?</p>

            <button
              class="btn btn-outline-success me-2"
              (click)="showGuest = true; showAdmin = false">
              Register as Guest
            </button>

            <button
              class="btn btn-outline-dark"
              (click)="showAdmin = true; showGuest = false">
              Register Hotel Admin
            </button>

          </div>


          <!-- ======================= -->
          <!-- GUEST REGISTER -->
          <!-- ======================= -->

          @if (showGuest) {

          <div class="form-section mt-4">

            <h4 class="section-title">Guest Registration</h4>

            <div class="form-group">
              <label>Name</label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="registerGuestModel.name"
                name="guestName"
                placeholder="Enter your name">
            </div>

            <div class="form-group">
              <label>Email</label>
              <input
                type="email"
                class="form-control"
                [(ngModel)]="registerGuestModel.email"
                name="guestEmail"
                placeholder="Enter email">
            </div>

            <div class="form-group">
              <label>Password</label>
              <input
                type="password"
                class="form-control"
                [(ngModel)]="registerGuestModel.password"
                name="guestPassword"
                placeholder="Create password">
            </div>

            <button
              class="btn btn-success w-100"
              (click)="RegisterGuest()">
              Register Guest
            </button>

          </div>

          }


          <!-- ======================= -->
          <!-- HOTEL ADMIN REGISTER -->
          <!-- ======================= -->

          @if (showAdmin) {

          <div class="form-section mt-4">

            <h4 class="section-title">Hotel Owner Registration</h4>

            <div class="form-group">
              <label>Name</label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="registerAdminHotelModel.name"
                name="adminName">
            </div>

            <div class="form-group">
              <label>Email</label>
              <input
                type="email"
                class="form-control"
                [(ngModel)]="registerAdminHotelModel.email"
                name="adminEmail">
            </div>

            <div class="form-group">
              <label>Password</label>
              <input
                type="password"
                class="form-control"
                [(ngModel)]="registerAdminHotelModel.password"
                name="adminPassword">
            </div>

            <div class="form-group">
              <label>Hotel Name</label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="registerAdminHotelModel.hotelName"
                name="hotelName">
            </div>

            <div class="form-group">
              <label>Address</label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="registerAdminHotelModel.address"
                name="hotelAddress">
            </div>

            <div class="form-group">
              <label>City</label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="registerAdminHotelModel.city"
                name="hotelCity">
            </div>

            <div class="form-group">
              <label>Description</label>
              <textarea
                class="form-control"
                [(ngModel)]="registerAdminHotelModel.description"
                name="hotelDescription"></textarea>
            </div>

            <button
              class="btn btn-dark w-100"
              (click)="RegisterAdminHotel()">
              Register Hotel
            </button>

          </div>

          }

        </div>

      </div>

    </div>

  </div>

</div>
